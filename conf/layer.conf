# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-cora"
BBFILE_PATTERN_meta-cora = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cora = "6"

LAYERDEPENDS_meta-cora = "core"
LAYERSERIES_COMPAT_meta-cora = "scarthgap"
